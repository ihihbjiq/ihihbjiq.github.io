      height: 100%;
      padding: 0;
      margin: 0;
      font-family: 'Sniglet', cursive, Arial, sans-serif;
      overflow: hidden;
    }

    @keyframes myfirst {
      0% { margin-left: -235px; }
      100% { margin-left: 100%; }
    }

    .fish {
      background-image: url('https://ihihbjiq.github.io/images/fish.webp');
      width: 235px;
      height: 104px;
      margin-left: -235px;
      position: absolute;
      animation: myfirst 12s linear infinite;
    }

    #fish { top: 120px; }
    #fish2 { top: 260px; animation-delay: 6s; }

    header {
      top: 10%;
      height: 42px;
      background: url('https://ihihbjiq.github.io/images/golf.webp') repeat-x bottom;
      position: relative;
      animation: waveAnimation 24s linear infinite;
      margin-bottom: 0;
    }

    @keyframes waveAnimation {
      0% { background-position: 100% 0; }
      100% { background-position: 0 0; }
    }

    #form {
      top: 10%;
      min-height: 90vh;
      background-color: #98d4f3;
      overflow: hidden;
      position: relative;
      padding-bottom: 50px;
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #fff;
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
    }

    .name {
      position: absolute;
      top: 140px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 36px;
      color: #333;
      font-weight: bold;
      white-space: nowrap;
    }

    .verification-badge {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 40px;
      margin-left: 10px;
      vertical-align: middle;
    }

    .verification-badge svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .icon-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: absolute;
      top: 250px;
      left: 50%;
      transform: translateX(-50%);
    }

    .icon-container a {
      text-decoration: none;
      color: #333;
      font-size: 36px;
      transition: transform 0.2s ease, color 0.3s ease;
    }

    .icon-container a:hover {
      transform: scale(1.2);
      color: #007bff;
    }

    .icon-container svg {
      display: block;
      width: 50px;
      height: 50px;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      color: #333;
      text-align: center;
      padding: 10px 0;
      font-size: 20px;
      font-weight: bold;
      background: none;
    }
  </style>
